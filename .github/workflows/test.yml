name: Tests

# Runs the test suite (npm test: Node API and rules tests, Python ingest tests) on every pull request,
# so a change is checked before it is merged. The data refresh commits to main are not tested here.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"   # node:sqlite (the D1 test double) needs Node 22.5 or later

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - run: npm test
