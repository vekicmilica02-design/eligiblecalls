name: Refresh calls

on:
  # The 2-hour refresh is started by the Cloudflare Worker "eligiblecalls-refresh" (cron "17 */2 * * *",
  # worker/refresh-timer.js), because GitHub delays or skips scheduled runs under load.
  # The daily schedule below is a fallback in case the Worker stops (for example an expired token).
  schedule:
    - cron: "53 4 * * *"     # daily fallback
    - cron: "41 6 * * 1"     # Mondays: also check the lists of participating countries
  workflow_dispatch:
    inputs:
      lists:
        description: "Also check the lists of participating countries"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ingest/requirements.txt

      - run: pip install -r ingest/requirements.txt

      - name: Fetch open calls from the EU Funding & Tenders Portal
        # The Portal API is public and sometimes unavailable for a few minutes. fetch.py already retries each request;
        # this repeats the whole import (3 tries, 90 and 180 seconds apart) before the run is reported as failed.
        run: |
          for attempt in 1 2 3; do
            if python ingest/fetch.py; then exit 0; fi
            echo "::warning::Portal import failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 90)); fi
          done
          exit 1

      - name: Fetch calls from the other sources (Interreg, EEA and Norway Grants, ERA-LEARN, UKRI, EU project calls)
        run: python ingest/fetch_extra.py
        continue-on-error: true   # a failing source keeps its last good data; the Portal import still publishes

      - name: Build site data
        run: python ingest/build.py

      - name: Read the evaluation criteria of the calls (call documents, Horizon Europe General Annex D, UKRI pages)
        run: |
          sudo apt-get install -y -qq poppler-utils > /dev/null || true
          python ingest/award_criteria.py
        continue-on-error: true   # a failure keeps the previous criteria file; the call data still publishes

      - name: Read the official eligibility conditions (call document "Eligibility" section, Horizon Europe General Annex B, UKRI "Who can apply")
        run: python ingest/eligibility_docs.py
        continue-on-error: true   # a failure keeps the previous eligibility file; the call data still publishes

      - name: Read the application forms of the calls (Part B templates linked from the Portal topic pages)
        run: python ingest/app_forms.py
        continue-on-error: true   # a failure keeps the previous forms file; every call still gets a criteria-based or general structure

      - name: Commit if anything changed
        run: |
          git config user.name "eligiblecalls-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/org ingest/state.json ingest/review.md ingest/extra.json ingest/extra_state.json
          if git diff --cached --quiet -- site/data; then
            echo "No changes to the site data."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if ! git diff --cached --quiet; then
            # Cloudflare Pages builds every commit to main (500 builds a month on the free plan). A commit that changes
            # nothing under site/ (only the importer's state files) starts with [CF-Pages-Skip], so Pages skips its build.
            skip=""
            if git diff --cached --quiet -- site; then skip="[CF-Pages-Skip] "; fi
            git commit -m "${skip}Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            # main also receives pull requests while a run takes several minutes, so the first push can be rejected
            # (non-fast-forward). Rebase the data commit on the new main and push again; on a file changed in both,
            # the data from this run wins (-X theirs means the commit being replayed, which is ours). A rejected push
            # was the likely cause of runs that failed at this step with everything before it green.
            pushed=false
            for attempt in 1 2 3 4 5; do
              if git push; then pushed=true; break; fi
              echo "::warning::push rejected (attempt $attempt of 5): rebasing the data commit on origin/main"
              git fetch --depth=50 origin main
              if ! git rebase -X theirs origin/main; then git rebase --abort || true; fi
              sleep $((attempt * 4))
            done
            if [ "$pushed" != "true" ]; then echo "::error::Could not push the data commit after 5 tries"; exit 1; fi
          fi
        id: commit

      # Deploys the site and the assistant (functions/) straight to the existing Cloudflare Pages project
      # (a Direct Upload project, the kind created by dragging a zip into the dashboard).
      # Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID and the repository
      # variable CF_PAGES_PROJECT (the project name, as in <name>.pages.dev). Skipped until they exist.
      - name: Deploy to Cloudflare Pages
        if: (steps.commit.outputs.changed == 'true' || github.event_name == 'workflow_dispatch') && vars.CF_PAGES_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true

      - name: Open an issue when calls need review
        if: hashFiles('ingest/review.md') != ''
        continue-on-error: true   # the data is already published at this point; a failed issue must not fail the run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! grep -q "^None.$" ingest/review.md; then
            title="Calls with an unreviewed participation restriction"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
              gh issue create --title "$title" --body-file ingest/review.md
            else
              n=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
              gh issue edit "$n" --body-file ingest/review.md
            fi
          fi

      - name: Check lists of participating countries (weekly)
        if: github.event.schedule == '41 6 * * 1' || inputs.lists == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python ingest/watch_lists.py
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            title="New version of a list of participating countries"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
              gh issue create --title "$title" --body-file ingest/list_versions.md
            fi
          fi

  # If a run fails (Portal down, API change, sanity check), GitHub emails the repository owner.
