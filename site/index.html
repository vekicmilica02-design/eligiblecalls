<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fffcf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#232323" media="(prefers-color-scheme: dark)">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<title>Eligible Calls</title>
<script>try { var th = JSON.parse(localStorage.getItem("konkursi.theme")); if (th === "dark" || th === "light") document.documentElement.dataset.theme = th; } catch (e) {}</script>
<meta name="description" content="Open EU funding calls from the Funding & Tenders Portal, with eligibility checked for your country.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: search-first masthead, then a quiet filter rail beside a single column of opportunity rows.
   Each row leads with its deadline (date column), then title + metadata, then eligibility and the official link. */
:root {
  /* Eligible Calls palette (brand sheet, 2 Oct 2026). Light: cream, ink, violet for actions, sage/lime for "eligible",
     orchid (logo colour) for urgency, deep teal for "eligible with a condition", peach and grey-blue for soft fills.
     Darker shades of sage, orchid and teal are used for small text so it stays readable. */
  --bg: #fffcf3;
  --surface: #ffffff;
  --sunk: #f6f1e3;
  --ink: #232323;
  --ink-2: #3f3b47;
  --muted: #5d5868;
  --line: #e6dfcd;
  --line-2: #f0eadb;
  --green: #756594;          /* primary action colour (violet); name kept for existing rules */
  --green-hover: #5f5179;
  --green-ink: #ffffff;
  --green-soft: #ece8f3;
  --yes: #46703a;            /* sage, darkened for text */
  --yes-dot: #6e9c60;
  --yes-soft: #e4f3d9;       /* lime tint */
  --orange: #a8429f;         /* urgency: orchid from the logo, deepened for text (name kept for existing rules) */
  --orange-strong: #d06ccc;
  --orange-soft: #f8e7f6;
  --peach: #fda485;
  --peach-soft: #feeadf;
  --part: #3c6d67;           /* "eligible with a condition": deep teal from the palette, deepened for text */
  --part-soft: #e3efed;
  --grey-soft: #e8edf1;      /* grey-blue tint */
  --brand: #d06ccc;
  --focus: #756594;
  --wave-a: 95, 81, 121;     /* violet, deepened for the light background (r,g,b for the hero canvas) */
  --wave-b: 168, 66, 159;    /* orchid, deepened */
  --wave-c: 70, 112, 58;     /* sage, deepened */
  --wave-alpha: 1.45;        /* light theme dots are drawn stronger */
  --f-sans: "Bricolage Grotesque", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 6px;
  --r-lg: 12px;
  --max: 1240px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #232323; --surface: #2a2a2a; --sunk: #303030; --ink: #f6f3ea; --ink-2: #d5d9de; --muted: #a3abb3;
    --line: #3a3a3a; --line-2: #303030; --green: #6ac2b8; --green-hover: #86d1c8; --green-ink: #1c1c1c; --green-soft: #2e403e;
    --yes: #7ed957; --yes-dot: #7ed957; --yes-soft: #2d3d26; --orange: #d06ccc; --orange-strong: #d06ccc; --orange-soft: #312330;
    --peach: #ffde59; --peach-soft: #3a3522; --part: #ffde59; --part-soft: #39351f; --grey-soft: #33383d; --brand: #d06ccc; --focus: #6ac2b8;
    --wave-a: 106, 194, 184; --wave-b: 208, 108, 204; --wave-c: 255, 222, 89; --wave-alpha: 1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #232323; --surface: #2a2a2a; --sunk: #303030; --ink: #f6f3ea; --ink-2: #d5d9de; --muted: #a3abb3;
  --line: #3a3a3a; --line-2: #303030; --green: #6ac2b8; --green-hover: #86d1c8; --green-ink: #1c1c1c; --green-soft: #2e403e;
  --yes: #7ed957; --yes-dot: #7ed957; --yes-soft: #2d3d26; --orange: #d06ccc; --orange-strong: #d06ccc; --orange-soft: #312330;
  --peach: #ffde59; --peach-soft: #3a3522; --part: #ffde59; --part-soft: #39351f; --grey-soft: #33383d; --brand: #d06ccc; --focus: #6ac2b8;
  --wave-a: 106, 194, 184; --wave-b: 208, 108, 204; --wave-c: 255, 222, 89; --wave-alpha: 1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-sans); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--green); text-underline-offset: 3px; text-decoration-thickness: 1px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
h1, h2, h3 { font-family: var(--f-sans); font-weight: 600; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0; }
.wrap { max-width: var(--max); margin: 0 auto; padding-inline: 24px; }
@media (max-width: 560px) { .wrap { padding-inline: 16px; } }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.fine { font-size: 12.5px; color: var(--muted); }
.eyebrow { font-size: 13.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); }

/* ---------- header ---------- */
header.site { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
header.site .wrap { display: flex; align-items: center; gap: 28px; min-height: 64px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); margin-right: auto; }
.brand-name { font-weight: 700; font-size: 24px; letter-spacing: -0.035em; font-variation-settings: "opsz" 48; }
.brand-mark { width: 34px; height: 34px; color: var(--brand); flex: none; }
.brand-mark svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.brand-sub { font-size: 13px; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: var(--ink-2); padding: 20px 10px; font-size: 14.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
nav.main a:hover { color: var(--ink); }
nav.main a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--green); font-weight: 500; }
.count-pill { font-family: var(--f-mono); font-size: 11px; background: var(--green-soft); color: var(--green); border-radius: 10px; padding: 1px 6px; margin-left: 5px; }
.theme-btn { width: 34px; height: 30px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r); background: transparent; color: var(--ink-2); cursor: pointer; }
.theme-btn:hover { border-color: var(--ink); color: var(--ink); }
.theme-btn .i-moon { display: none; }
:root[data-theme="dark"] .theme-btn .i-sun { display: none; } :root[data-theme="dark"] .theme-btn .i-moon { display: block; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .theme-btn .i-sun { display: none; } :root:not([data-theme="light"]) .theme-btn .i-moon { display: block; } }
.lang { display: flex; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lang button { background: none; border: 0; padding: 4px 9px; font-size: 12px; font-weight: 600; letter-spacing: .04em; cursor: pointer; color: var(--muted); }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
@media (max-width: 1399px) { .brand-sub { display: none; } }
@media (max-width: 1279px) { header.site .wrap { gap: 14px; } nav.main a { padding-inline: 8px; } }
@media (min-width: 761px) and (max-width: 1023px) { nav.main a { padding-inline: 6px; font-size: 14px; } }
@media (max-width: 760px) {
  header.site { position: static; }
  header.site .wrap { gap: 8px; padding-block: 10px; min-height: 0; }
  nav.main { order: 3; width: 100%; overflow-x: auto; flex-wrap: nowrap; gap: 0; }
  nav.main a { white-space: nowrap; padding: 8px 10px; font-size: 14px; }
  .brand-sub { display: none; }
}
@media (max-width: 380px) { .brand-name { font-size: 20px; } }

/* ---------- search masthead ---------- */
.hero { position: relative; overflow: hidden; padding-block: 64px 44px; background: var(--bg); border-bottom: 1px solid var(--line); isolation: isolate; }
.hero > .wrap { position: relative; z-index: 1; }
.hero canvas.wave { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
@media (max-width: 720px) { .hero { padding-block: 40px 28px; } }
.hero .eyebrow { margin-bottom: 14px; display: flex; gap: 10px; align-items: center; }
.hero .eyebrow .live { color: var(--green); }
.hero .eyebrow .age { color: var(--muted); font-weight: 500; letter-spacing: .06em; }
.hero .eyebrow .age.stale { color: var(--orange); }
.hero h1 { font-size: clamp(32px, 5vw, 58px); font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; max-width: 20ch; }
.hero p.lede { color: var(--ink-2); max-width: 60ch; margin: 16px 0 28px; font-size: 16.5px; }
.builder { display: grid; gap: 12px; max-width: 920px; }
.searchrow { display: flex; align-items: stretch; background: var(--surface); border: 1.5px solid var(--ink); border-radius: var(--r-lg); overflow: hidden; }
.searchrow:focus-within { box-shadow: 0 0 0 3px var(--green-soft); border-color: var(--green); }
.searchrow .sicon { display: grid; place-items: center; padding-left: 18px; color: var(--muted); }
.searchrow input { flex: 1; min-width: 0; padding: 16px 14px; font-size: 18px; border: 0; background: transparent; outline: none; }
.searchrow .btn.big { border-radius: 0; padding-inline: 26px; font-size: 15px; }
.profile-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 720px) { .profile-row { grid-template-columns: minmax(0, 1fr); } }
.pick { position: relative; display: grid; gap: 1px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 9px 36px 9px 14px; cursor: pointer; min-width: 0; }
.pick:hover { border-color: var(--muted); }
.pick:focus-within { border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.pick.set { background: var(--green-soft); border-color: transparent; }
.pick .pl { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.pick.set .pl { color: var(--green); }
.pick select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; font-size: 15.5px; font-weight: 500; padding: 0; width: 100%; cursor: pointer; outline: none; text-overflow: ellipsis; }
.pick::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
select option, select optgroup { color: var(--ink); background: var(--bg); }
select option { padding: 6px 14px; }
/* Browsers that support styled select menus (Chrome/Edge 135+) draw the opened menu in the page,
   so it gets the page background and comfortable padding. Others keep their native menu. */
@supports (appearance: base-select) {
  select, .pick select, ::picker(select) { appearance: base-select; -webkit-appearance: base-select; }
  ::picker(select) { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px 0; margin-top: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: min(420px, 60vh); }
  select option { padding: 9px 18px; gap: 8px; font-size: 15px; font-weight: 450; }
  select option:hover, select option:focus-visible { background: var(--sunk); outline: none; }
  select option:checked { font-weight: 600; }
  select optgroup { padding: 4px 0; }
  select optgroup::before, select optgroup > legend { padding: 8px 18px 4px; }
  select optgroup option { padding-left: 30px; }
  .pick select::picker-icon { display: none; }
  .toolbar select::picker-icon, .inline-country::picker-icon, #fCountrySel::picker-icon { color: var(--muted); }
}

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border-radius: var(--r); border: 1px solid var(--green); background: var(--green); color: var(--green-ink); font-weight: 500; cursor: pointer; text-decoration: none; font-size: 14px; white-space: nowrap; }
.btn:hover { background: var(--green-hover); border-color: var(--green-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--ink); background: transparent; }
.btn.quiet { background: var(--surface); color: var(--ink-2); border-color: var(--line); }
.btn.quiet:hover { border-color: var(--ink); }
.btn.big { padding: 13px 22px; font-size: 15px; }
.btn.ext { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.btn.ext:hover { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn.ext .arr { color: var(--green); }
.btn.ext:hover .arr { color: inherit; }
.btn .arr { font-size: 1.05em; line-height: 1; }
.linkbtn { background: none; border: 0; color: var(--ink-2); cursor: pointer; font-size: 13px; padding: 2px 0; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--green); }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--ink-2); }

/* ---------- closing soon strip ---------- */
.soon { padding-block: 28px 4px; }
.soon-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.soon-head h2 { font-size: 19px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); display: flex; gap: 8px; align-items: center; }
.soon-head h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange-strong); }
.soon-head a { font-size: 13.5px; color: var(--ink-2); }
.soon-list { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(260px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }
.soon-item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); text-decoration: none; color: var(--ink); min-width: 0; }
.soon-item:hover { border-color: var(--ink); }
.soon-item .t { font-size: 14px; font-weight: 500; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.soon-item .p { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.dateblock { text-align: center; line-height: 1; min-width: 42px; padding-top: 2px; }
.dateblock .d { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; color: var(--orange); font-variant-numeric: tabular-nums; }
.dateblock .m { font-size: 12.5px; letter-spacing: 0; color: var(--muted); margin-top: 4px; }

/* ---------- results layout ---------- */
.results-wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; padding-block: 32px 56px; }
@media (max-width: 960px) { .results-wrap { grid-template-columns: minmax(0, 1fr); gap: 0; } }
aside.filters { align-self: start; position: sticky; top: 80px; max-height: calc(100vh - 96px); overflow-y: auto; padding-right: 6px; scrollbar-width: thin; }
.filters-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; }
.filters-head h2 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
details.facet { border-top: 1px solid var(--line); padding-block: 12px; }
details.facet summary { cursor: pointer; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 6px; }
details.facet summary::-webkit-details-marker { display: none; }
details.facet summary::after { content: ""; margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid var(--muted); border-bottom: 1.5px solid var(--muted); transform: rotate(45deg); transition: transform .15s; }
details.facet[open] summary::after { transform: rotate(-135deg); }
details.facet summary .fine { font-weight: 400; font-size: 11.5px; }
details.facet summary .n { font-family: var(--f-mono); font-size: 11px; background: var(--green); color: var(--green-ink); border-radius: 10px; padding: 0 6px; }
.opts { display: grid; gap: 0; margin-top: 8px; }
.opt { display: grid; grid-template-columns: 16px 1fr auto; gap: 10px; align-items: center; font-size: 14px; padding: 5px 0; cursor: pointer; color: var(--ink-2); }
.opt:hover { color: var(--ink); }
.opt input { margin: 0; accent-color: var(--green); width: 15px; height: 15px; }
.opt .c { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt.zero { opacity: .45; }
.toolbar-sel { font-size: 14px; }
.filters-close { display: none; }
@media (max-width: 960px) {
  aside.filters { position: fixed; inset: 0; top: 0; z-index: 50; background: var(--surface); max-height: none; padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(96px + env(safe-area-inset-bottom, 0px)); display: none; }
  aside.filters.open { display: block; }
  .filters-close { display: flex; position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); gap: 8px; }
  .filters-close .btn { flex: 1; }
}
.toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; flex-wrap: wrap; padding-bottom: 14px; }
.toolbar h2 { font-size: 26px; letter-spacing: -0.02em; }
.toolbar h2 .cnt { color: var(--muted); font-weight: 400; }
.toolbar .meta { color: var(--muted); font-size: 14px; margin-top: 4px; }
.toolbar-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.toolbar select { padding: 10px 34px 10px 14px; border: 1px solid var(--line); border-radius: var(--r); background-color: var(--bg); font-size: 13.5px; }
.mobile-filter-btn { display: none; }
@media (max-width: 960px) { .mobile-filter-btn { display: inline-flex; } }
.elig-tabs { display: flex; gap: 0; flex-wrap: wrap; margin-bottom: 14px; border: 1px solid var(--line); border-radius: var(--r); width: fit-content; max-width: 100%; overflow: hidden; background: var(--surface); }
.elig-tabs button { border: 0; border-right: 1px solid var(--line); background: transparent; padding: 7px 12px; font-size: 13px; cursor: pointer; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.elig-tabs button:last-child { border-right: 0; }
.elig-tabs button[aria-pressed="true"] { color: var(--ink); background: var(--sunk); font-weight: 500; }
.elig-tabs button .mono { color: var(--muted); }
.elig-tabs button::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--muted); }
.elig-tabs button[data-el="Y"]::before { background: var(--yes-dot); border-color: var(--yes-dot); }
.elig-tabs button[data-el="P"]::before { background: var(--part); border-color: var(--part); }
.elig-tabs button[data-el="N"]::before { background: var(--muted); border-color: var(--muted); }
.active-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
.af { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 12px; font-size: 13px; cursor: pointer; }
.af:hover { border-color: var(--ink); }
.af::after { content: "×"; font-size: 15px; line-height: 1; color: var(--muted); }

/* ---------- opportunity rows ---------- */
.cards { display: grid; gap: 0; border-top: 1px solid var(--line); }
.group-head { display: flex; align-items: center; gap: 8px; padding: 20px 0 8px; font-size: 14px; font-weight: 600; letter-spacing: 0; color: var(--muted); border-bottom: 1px solid var(--line); }
.group-head .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.group-head.yes { color: var(--yes); } .group-head.yes .dot { background: var(--yes-dot); }
.group-head.partial { color: var(--part); } .group-head.partial .dot { background: var(--part); }
.group-head .mono { color: var(--muted); font-weight: 400; }
.card { display: grid; grid-template-columns: 88px minmax(0, 1fr) 230px; gap: 24px; padding: 22px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.card-date { display: grid; align-content: start; gap: 2px; font-variant-numeric: tabular-nums; }
.card-date .cd-l { font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.card-date .cd-d { font-size: 34px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; margin-top: 4px; }
.card-date .cd-m { font-size: 13px; color: var(--ink-2); }
.card-date .cd-left { font-size: 12px; color: var(--muted); margin-top: 6px; }
.card-date .cd-t { font-size: 11.5px; color: var(--muted); }
.card-date.urgent .cd-d, .card-date.urgent .cd-left { color: var(--orange); }
.card-date.urgent .cd-left { font-weight: 600; }
.card-date .cd-more { font-size: 11.5px; color: var(--muted); }
.card-main { min-width: 0; display: grid; gap: 8px; align-content: start; }
.card-kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.card-kicker a { color: var(--ink-2); font-weight: 600; text-decoration: none; }
.card-kicker a:hover { color: var(--green); text-decoration: underline; }
.card-kicker .sep { width: 3px; height: 3px; border-radius: 50%; background: var(--muted); }

/* ---------- eligibility stamps ---------- */

/* ---------- detail ---------- */

function setData(tax, progs, calls) {
  TAX = tax; PROGS = progs.programmes; META = calls; CALLS = calls.calls; P = {}; BYKEY = {}; HAY.clear();
  PROGS.forEach((p) => (P[p.id] = p));
  for (const k of ["countries", "sectors", "applicants", "types", "partnership", "fundingBands", "deadlineBuckets", "sectorGroups", "applicantGroups"]) { IDX[k] = {}; TAX[k].forEach((x) => (IDX[k][x.id] = x)); }
  CALLS.forEach((c) => { c.key = keyOf(c); BYKEY[c.key] = c; });

async function load() {
  const [tax, progs, calls] = await Promise.all([getJSON("data/taxonomy.json"), getJSON("data/programmes.json"), getJSON("data/calls.json")]);

}
/* New imports are published every few hours. An open page checks every 15 minutes and swaps in the new data
   (the request is conditional, so an unchanged file costs a 304). */
async function checkForNewData() {
  if (document.hidden || !META) return;
  try {
    const calls = await getJSON("data/calls.json");
    if (calls.generated === META.generated) return;
    const [tax, progs] = await Promise.all([getJSON("data/taxonomy.json"), getJSON("data/programmes.json")]);
    const typing = document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && document.getElementById("app").contains(document.activeElement);
    setData(tax, progs, calls); CHANGES = null; ID_RE = null;
    const y = window.scrollY;
    if (lastRoute === "home" && typing) { renderResults(); renderFilters(); } else route();
    applyLang(); updateSavedCount(); window.scrollTo(0, y); openSig = sigNow();
  } catch (err) { /* offline or mid-deploy: try again next time */ }
}
setInterval(checkForNewData, 15 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && META && Date.now() - Date.parse(META.generated) > 2.5 * 36e5) checkForNewData(); });

/* ---------- dates ---------- */
const DAY = 864e5;
const loc = () => (lang === "sr" ? "sr-Latn-RS" : "en-GB");
function fmtDate(iso, opts) { if (!iso) return ""; const [y, m, d] = iso.slice(0, 10).split("-").map(Number); return new Intl.DateTimeFormat(loc(), Object.assign({ day: "numeric", month: "long", year: "numeric", timeZone: "UTC" }, opts || {})).format(new Date(Date.UTC(y, m - 1, d))); }

/* Deadlines. "2026-11-30": EU Portal grant topic, 17:00 Brussels time (the Portal topic page renders every grant
   deadline that way). "2026-11-30T12:00|Europe/Belgrade": time and zone stated by the organiser. "2026-11-30|~": the
   organiser states only a date; the call stays open until 23:59 Brussels time and the page says the time is not stated.
   ingest/deadlines.py and src/core.js read the same forms. A call closes at that instant, not at midnight. */
const DL_TIME = "17:00", DL_TZ = "Europe/Brussels";
function tzOffsetMin(utcMs, tz) {
  const parts = new Intl.DateTimeFormat("en-US", { timeZone: tz, hourCycle: "h23", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" }).formatToParts(new Date(utcMs));
  const m = {}; parts.forEach((p) => (m[p.type] = p.value));
  return (Date.UTC(+m.year, +m.month - 1, +m.day, +m.hour % 24, +m.minute, +m.second) - utcMs) / 6e4;

const DLPARSE = new Map();

  const m = /^(\d{4}-\d\d-\d\d)(?:T(\d\d:\d\d)\|([A-Za-z_]+\/[A-Za-z_]+)|(\|~))?$/.exec(s) || [];
  v = m[2] ? { date: m[1], time: m[2], tz: m[3], kind: "time" } : m[4] ? { date: m[1], time: "23:59", tz: DL_TZ, kind: "date" } : { date: m[1] || String(s).slice(0, 10), time: DL_TIME, tz: DL_TZ, kind: "portal" };

}
const DLCACHE = new Map();
function dlMs(iso) {
  if (DLCACHE.has(iso)) return DLCACHE.get(iso);
  const p = dlParse(iso); const [y, mo, d] = p.date.split("-").map(Number); const [h, mi] = p.time.split(":").map(Number);
  const guess = Date.UTC(y, mo - 1, d, h, mi); let v = guess - tzOffsetMin(guess, p.tz) * 6e4;
  v = guess - tzOffsetMin(v, p.tz) * 6e4;

}
const dlDay = (s) => +String(s).slice(8, 10);
const tzCity = (tz) => tz.split("/").pop().replace(/_/g, " ");
function shortTime(iso) { const p = dlParse(iso); return p.kind === "date" ? "" : p.time; }
function cardTime(iso) { const p = dlParse(iso); return p.kind === "portal" ? `${DL_TIME} ${t("brussels")}` : p.kind === "time" ? `${p.time} ${t("tzTime", tzCity(p.tz))}` : t("timeUnknownShort"); }

const msLeft = (iso) => dlMs(iso) - Date.now();
function daysUntil(iso) { return Math.max(0, Math.floor(msLeft(iso) / DAY)); }

const isOpen = (c) => !!nextDl(c);

  if (ms < DAY) return t("closesIn", Math.floor(ms / 36e5), Math.floor((ms % 36e5) / 6e4));

const leftSpan = (iso, cls) => `<span class="${cls}" data-dl="${iso}">${esc(leftText(iso))}</span>`;
function timeText(iso) {

  else s = `${p.time} ${t("tzTime", tzCity(p.tz))}`;

}

/* ---------- eligibility ---------- */
const ELCLS = { Y: "yes", P: "partial", N: "no", C: "unknown" };
function elig(c, cc) { const e = c.eligibility[cc]; if (!e) return { s: "C", note: "" }; return { s: e[0], note: c.reasons[e[1]] || "" }; }
function stampHTML(c, cc, short) {
  if (!cc) return `<span class="pick-country">${esc(t("pickCountry"))}</span>`;
  const e = elig(c, cc);
  return `<span class="stamp ${ELCLS[e.s]}" title="${esc(e.note)}"><span class="dot" aria-hidden="true"></span>${esc(nm(IDX.countries[cc]))}: ${esc(t((short ? "elShort" : "el") + e.s))}</span>`;
}

/* ---------- filters ---------- */
const FACETS = ["status", "applicants", "sectors", "programmes", "funding", "deadline", "types", "partnership"];
const emptyFilters = () => ({ q: "", country: store.get("country", ""), status: [], applicants: [], sectors: [], programmes: [], funding: [], deadline: [], types: [], partnership: [], elig: ["Y", "P", "C"], sort: "deadline" });
let F = emptyFilters();
function bandOf(c) { const v = c.bandValue; if (v == null) return "b0"; const b = TAX.fundingBands.find((b) => b.min != null && v >= b.min && (b.max == null || v <= b.max)); return b ? b.id : "b0"; }
function bucketOf(c) { const n = nextDl(c); if (!n) return null; const d = daysUntil(n); return d <= 7 ? "week" : d <= 30 ? "month" : d <= 92 ? "quarter" : "later"; }
function inBucket(c, id) { const b = bucketOf(c); if (!b) return false; const o = ["week", "month", "quarter", "later"]; return id === "later" ? b === "later" : o.indexOf(b) <= o.indexOf(id); }
const HAY = new Map();
function hay(c) { if (!HAY.has(c.key)) HAY.set(c.key, norm([c.title, c.id, c.callId, c.callTitle, c.programmeName, (c.keywords || []).join(" "), (c.tags || []).join(" "), c.description, c.cascade ? c.cascade.project + " " + c.cascade.projectName : "", c.sectors.map((s) => IDX.sectors[s] ? IDX.sectors[s].en + " " + IDX.sectors[s].sr : s).join(" ")].join(" "))); return HAY.get(c.key); }
function match(c, f, skip) {
  if (!isOpen(c)) return false;
  if (f.q && !norm(f.q).split(/\s+/).filter(Boolean).every((w) => hay(c).includes(w))) return false;
  const any = (arr, fn) => arr.length === 0 || arr.some(fn);
  if (skip !== "status" && !any(f.status, (s) => (c.status || "open") === s)) return false;
  if (skip !== "applicants" && !any(f.applicants, (s) => c.applicants.includes(s))) return false;
  if (skip !== "sectors" && !any(f.sectors, (s) => c.sectors.includes(s))) return false;
  if (skip !== "programmes" && !any(f.programmes, (s) => c.programme === s)) return false;
  if (skip !== "types" && !any(f.types, (s) => c.type === s)) return false;
  if (skip !== "partnership" && !any(f.partnership, (s) => c.partnership === s)) return false;
  if (skip !== "funding" && !any(f.funding, (s) => bandOf(c) === s)) return false;
  if (skip !== "deadline" && !any(f.deadline, (s) => inBucket(c, s))) return false;

/* With a country chosen, eligible calls come first, then "eligible with a condition", then "check",
   then "not eligible"; inside each group the chosen sort applies. The closing-soon strip and the
   Deadlines page stay in pure deadline order. */
const ELRANK = { Y: 0, P: 1, C: 2, N: 3 };
function sortList(list) {
  const by = F.sort === "funding" ? (a, b) => (b.bandValue || 0) - (a.bandValue || 0) : (a, b) => (nextDl(a) || "9").localeCompare(nextDl(b) || "9");
  if (!F.country) return list.sort(by);
  return list.sort((a, b) => ELRANK[elig(a, F.country).s] - ELRANK[elig(b, F.country).s] || by(a, b));
}
/* Cards with a small heading where the eligibility group changes (only when a country is chosen). */
function cardsGrouped(list) {
  if (!F.country) return list.map(card).join("");
  let prev = null;
  return list.map((c) => { const s = elig(c, F.country).s; const head = s !== prev ? `<div class="group-head ${ELCLS[s]}"><span class="dot" aria-hidden="true"></span>${esc(t("el" + s))} <span class="mono">${list.filter((x) => elig(x, F.country).s === s).length}</span></div>` : ""; prev = s; return head + card(c); }).join("");
}
function facetCount(facet, id) { const f = Object.assign({}, F, { [facet]: [id] }); return CALLS.filter((c) => match(c, f)).length; }

/* ---------- formatting ---------- */
function money(n, cur) { if (!cur) return new Intl.NumberFormat(loc(), { maximumFractionDigits: 0 }).format(n) + ` (${t("noCurrency")})`; return new Intl.NumberFormat(loc(), { style: "currency", currency: cur, maximumFractionDigits: 0 }).format(n); }
function fundingText(c) {

  if (f.minPerGrant && f.maxPerGrant && f.minPerGrant !== f.maxPerGrant) return `${money(f.minPerGrant, f.currency)} – ${money(f.maxPerGrant, f.currency)} ${t("perGrant")}`;
  if (f.maxPerGrant) return `${t("upTo")} ${money(f.maxPerGrant, f.currency)} ${t("perGrant")}`;
  if (f.topicBudget) return `${t("topicBudget")} ${money(f.topicBudget, f.currency)}${f.expectedGrants ? " " + t("forGrants", f.expectedGrants) : ""}`;
  if (f.callBudget) return `${t("callBudget")} ${money(f.callBudget, f.currency)}`;

}

  const d = daysUntil(n); const later = c.deadlines.filter((x) => x > n).length;
  return `<span>${esc(fmtDate(n, long ? {} : { month: "short" }))}${(long ? timeText(n) : shortTime(n)) ? ", " + esc(long ? timeText(n) : shortTime(n)) : ""}</span>${leftSpan(n, "left" + (d > 30 ? " calm" : ""))}${later ? `<span class="left calm">${esc(t("moreCutoffs", later))}</span>` : ""}${long ? `<span class="fine">${esc(timeNoteFor(c))}</span>` : ""}`;
}
const tagList = (ids, dict, cls, max) => { const s = ids.slice(0, max); const more = ids.length - s.length; return s.map((id) => `<span class="tag ${cls}">${esc(nm(dict[id]) || id)}</span>`).join("") + (more > 0 ? `<span class="tag ${cls}">+${more}</span>` : ""); };

/* ---------- saved ---------- */

  money: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M17 6.5A7 7 0 1 0 17 17.5"/><path d="M4 10h9M4 14h9"/></svg>',
  type: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h11l5 5v9H4z"/><path d="M15 5v5h5"/></svg>',
  people: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5a3 3 0 0 1 0 6M21 20c0-2.6-1.7-4.9-4-5.7"/></svg>'

/* ---------- hero: field of dotted wave lines (canvas). Slow, pauses when hidden, still under reduced motion ---------- */
const Wave = (() => {

    const top = narrow ? H * 0.55 : H * 0.18, span = H - top + 20;

      const peach = i % 6 === 3, third = i % 7 === 5;
      ctx.fillStyle = `rgb(${peach ? cB : third ? cC : cA})`;
      const base = top + (i / (lines - 1)) * span;
      const amp = 14 + 26 * Math.sin(i * 0.37 + 1.1) ** 2;
      for (let x = -gap; x < W + gap; x += gap) {
        const u = x / W;
        const y = base + amp * Math.sin(u * 5.2 + t * 0.00022 + i * 0.28) + 9 * Math.sin(u * 11.0 - t * 0.00013 + i * 0.55);
        const fade = narrow ? 0.4 : 0.1 + 0.75 * smooth(0.15, 0.85, u);

  }

  function stop() { if (raf) cancelAnimationFrame(raf); raf = 0; if (io) io.disconnect(); if (ro) ro.disconnect(); io = ro = null; }

    if ("ResizeObserver" in window) { ro = new ResizeObserver(size); ro.observe(cv); } size();
    if ("IntersectionObserver" in window) { io = new IntersectionObserver((es) => { visible = es[0].isIntersecting; visible ? play() : (raf && cancelAnimationFrame(raf), raf = 0); }); io.observe(cv); }
    play();
  }
  document.addEventListener("visibilitychange", () => (document.hidden ? (raf && cancelAnimationFrame(raf), raf = 0) : play()));
  if (window.matchMedia) {
    matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => { colours(); draw(t0); });
    matchMedia("(prefers-reduced-motion: reduce)").addEventListener?.("change", () => { draw(t0); play(); });
  }
  return { mount, refresh: () => { colours(); draw(t0); } };
})();

/* ---------- home ---------- */
function groupMatch(groups, key, sel) { const g = groups.find((g) => g[key].length === sel.length && g[key].every((x) => sel.includes(x))); return g ? g.id : ""; }

  return (withAny ? `<option value="">${esc(t("anyCountry"))}</option>` : "") + order.map((g) => `<optgroup label="${esc(labels[g][lang === "sr" ? 1 : 0])}">${TAX.countries.filter((c) => c.group === g).sort((a, b) => nm(a).localeCompare(nm(b))).map((c) => `<option value="${c.id}"${c.id === sel ? " selected" : ""}>${esc(nm(c))}</option>`).join("")}</optgroup>`).join("");
}

function syncBuilder() {
  const a = document.getElementById("bApp"); if (!a) return;
  a.value = groupMatch(TAX.applicantGroups, "applicants", F.applicants);
  document.getElementById("bSector").value = groupMatch(TAX.sectorGroups, "sectors", F.sectors);
  ["bCountry", "bApp", "bSector"].forEach((id) => { const el = document.getElementById(id); if (el && el.parentElement.classList.contains("pick")) el.parentElement.classList.toggle("set", !!el.value); });
}
function facetDef() {
  const used = (list, key) => list.filter((x) => CALLS.some((c) => (Array.isArray(c[key]) ? c[key].includes(x.id) : c[key] === x.id)));
  return [
    ...(CALLS.some(isSoon) ? [{ key: "status", title: t("fStatus"), items: [{ id: "open", label: t("stOpenNow") }, { id: "forthcoming", label: t("stSoon") }], limit: 5, open: true }] : []),
    { key: "applicants", title: t("fApplicant"), items: used(TAX.applicants, "applicants").map((x) => ({ id: x.id, label: nm(x) })), limit: 9, open: true, note: t("derived") },
    { key: "sectors", title: t("fSector"), items: used(TAX.sectors, "sectors").map((x) => ({ id: x.id, label: nm(x) })), limit: 8, open: true, note: t("derived") },
    { key: "programmes", title: t("fProgramme"), items: PROGS.filter((p) => CALLS.some((c) => c.programme === p.id)).map((p) => ({ id: p.id, label: p.short })), limit: 30 },
    { key: "deadline", title: t("fDeadline"), items: TAX.deadlineBuckets.map((x) => ({ id: x.id, label: nm(x) })), limit: 10 },
    { key: "funding", title: t("fFunding"), items: TAX.fundingBands.map((x) => ({ id: x.id, label: nm(x) })), limit: 10 },
    { key: "types", title: t("fType"), items: TAX.types.map((x) => ({ id: x.id, label: nm(x) })), limit: 10 },
    { key: "partnership", title: t("fPartner"), items: TAX.partnership.map((x) => ({ id: x.id, label: nm(x) })), limit: 10 }
  ];
}
const openState = {}; const expanded = {};
function renderFilters() {
  const el = document.getElementById("filters"); if (!el) return;
  const countryBlock = `<details class="facet" open><summary>${esc(t("fCountry"))}${F.country ? `<span class="n">1</span>` : ""}</summary><div class="opts" style="margin-top:8px"><label class="vh" for="fCountrySel">${esc(t("fCountry"))}</label><select id="fCountrySel" class="toolbar-sel" style="padding:10px 14px;border:1px solid var(--line);border-radius:var(--r);background-color:var(--bg);width:100%">${countryOptions(F.country, true)}</select></div></details>`;
  const html = facetDef().map((fd) => {
    const sel = F[fd.key]; const isOpen = openState[fd.key] ?? (fd.open || sel.length > 0);
    const items = fd.items.map((it) => ({ ...it, c: facetCount(fd.key, it.id) }));
    const visible = expanded[fd.key] ? items : items.filter((it, i) => i < fd.limit || sel.includes(it.id));
    const opts = visible.map((it) => { const id = `f-${fd.key}-${it.id}`; return `<label class="opt${it.c === 0 && !sel.includes(it.id) ? " zero" : ""}" for="${id}"><input type="checkbox" id="${id}" data-facet="${fd.key}" value="${it.id}"${sel.includes(it.id) ? " checked" : ""}><span>${esc(it.label)}</span><span class="c">${it.c}</span></label>`; }).join("");
    const more = items.length > fd.limit ? `<button type="button" class="linkbtn" data-more="${fd.key}">${esc(expanded[fd.key] ? t("showLess") : t("showMore") + ` (${items.length})`)}</button>` : "";
    return `<details class="facet" data-key="${fd.key}"${isOpen ? " open" : ""}><summary>${esc(fd.title)}${fd.note ? ` <span class="fine">(${esc(fd.note)})</span>` : ""}${sel.length ? `<span class="n">${sel.length}</span>` : ""}</summary><div class="opts">${opts}</div>${more}</details>`;
  }).join("");
  el.innerHTML = `<div class="filters-head"><h2>${esc(t("filters"))}</h2>${activeCount() ? `<button type="button" class="linkbtn" id="clearAll">${esc(t("clearAll"))}</button>` : ""}</div>${countryBlock}${html}
    <div class="filters-close"><button type="button" class="btn quiet" id="fClear">${esc(t("clearAll"))}</button><button type="button" class="btn" id="fDone">${esc(t("showResults"))}</button></div>`;
  el.querySelector("#fCountrySel").addEventListener("change", (e) => { F.country = e.target.value; store.set("country", F.country); const b = document.getElementById("bCountry"); if (b) b.value = F.country; refresh(); });
  el.querySelectorAll("input[data-facet]").forEach((cb) => cb.addEventListener("change", () => { const arr = F[cb.dataset.facet]; const i = arr.indexOf(cb.value); cb.checked ? i < 0 && arr.push(cb.value) : i >= 0 && arr.splice(i, 1); refresh(); }));
  el.querySelectorAll("details.facet[data-key]").forEach((d) => d.addEventListener("toggle", () => (openState[d.dataset.key] = d.open)));
  el.querySelectorAll("[data-more]").forEach((b) => b.addEventListener("click", () => { expanded[b.dataset.more] = !expanded[b.dataset.more]; renderFilters(); }));
  const clear = () => { const s = F.sort, c = F.country; F = emptyFilters(); F.sort = s; F.country = c; const q = document.getElementById("q"); if (q) q.value = ""; refresh(); };
  const ca = el.querySelector("#clearAll"); if (ca) ca.addEventListener("click", clear);
  el.querySelector("#fClear").addEventListener("click", clear);
  el.querySelector("#fDone").addEventListener("click", () => { el.classList.remove("open"); document.getElementById("resultsCol").scrollIntoView(); });
}
function refresh() { const f = document.getElementById("filters"); const sc = f ? f.scrollTop : 0; renderFilters(); if (f) document.getElementById("filters").scrollTop = sc; renderResults(); syncBuilder(); }
function activeCount() { return FACETS.reduce((n, k) => n + F[k].length, 0) + (F.q ? 1 : 0); }
function labelFor(k, id) { if (k === "status") return t(id === "open" ? "stOpenNow" : "stSoon"); const m = { sectors: IDX.sectors, applicants: IDX.applicants, funding: IDX.fundingBands, deadline: IDX.deadlineBuckets, types: IDX.types, partnership: IDX.partnership }; return k === "programmes" ? (P[id] ? P[id].short : id) : nm(m[k][id]); }
function renderResults() {
  const col = document.getElementById("resultsCol"); if (!col) return;
  const list = sortList(CALLS.filter((c) => match(c, F)));
  const grp = { sectors: groupMatch(TAX.sectorGroups, "sectors", F.sectors), applicants: groupMatch(TAX.applicantGroups, "applicants", F.applicants) };
  const chips = FACETS.flatMap((k) => grp[k] ? [`<button type="button" class="af" data-rm="${k}:*">${esc(nm((k === "sectors" ? IDX.sectorGroups : IDX.applicantGroups)[grp[k]]))}</button>`] : F[k].map((id) => `<button type="button" class="af" data-rm="${k}:${id}">${esc(labelFor(k, id))}</button>`));
  if (F.q) chips.unshift(`<button type="button" class="af" data-rm="q:">“${esc(F.q)}”</button>`);
  const eTabs = F.country ? ["Y", "P", "C", "N"].map((s) => `<button type="button" data-el="${s}" aria-pressed="${F.elig.includes(s)}">${esc(t("elShort" + s))} <span class="mono">${CALLS.filter((c) => match(c, Object.assign({}, F, { elig: [s] }))).length}</span></button>`).join("") : "";
  col.innerHTML = `
    <div class="toolbar"><div><h2>${esc(t(CALLS.some(isSoon) ? "resultsAll" : "results"))} <span class="cnt">${list.length}</span></h2><div class="meta" aria-live="polite">${esc(t("nResults", list.length))}${F.country ? " · " + esc(nm(IDX.countries[F.country])) : ""}</div></div>
      <div class="toolbar-right"><button type="button" class="btn quiet mobile-filter-btn" id="openFilters">${esc(t("filters"))}${activeCount() ? ` (${activeCount()})` : ""}</button>
      <label class="vh" for="sort">${esc(t("sortLabel"))}</label><select id="sort"><option value="deadline">${esc(t("sortDeadline"))}</option><option value="funding">${esc(t("sortFunding"))}</option></select></div></div>
    ${eTabs ? `<div class="elig-tabs" role="group" aria-label="Eligibility">${eTabs}</div>` : ""}
    ${chips.length ? `<div class="active-filters">${chips.join("")}</div>` : ""}
    <div class="cards">${list.length ? cardsGrouped(list) : `<div class="empty"><h3>${esc(t("noResults"))}</h3><p>${esc(t("noResultsHint"))}</p></div>`}</div>`;
  col.querySelector("#sort").value = F.sort;
  col.querySelector("#sort").addEventListener("change", (e) => { F.sort = e.target.value; renderResults(); });
  col.querySelectorAll("[data-el]").forEach((b) => b.addEventListener("click", () => { const s = b.dataset.el; const i = F.elig.indexOf(s); if (i >= 0) { if (F.elig.length > 1) F.elig.splice(i, 1); } else F.elig.push(s); refresh(); }));
  col.querySelectorAll("[data-rm]").forEach((b) => b.addEventListener("click", () => { const [k, id] = b.dataset.rm.split(":"); if (k === "q") { F.q = ""; const q = document.getElementById("q"); if (q) q.value = ""; } else F[k] = id === "*" ? [] : F[k].filter((x) => x !== id); refresh(); }));
  col.querySelector("#openFilters").addEventListener("click", () => document.getElementById("filters").classList.add("open"));
  bindSaves(col);
}

  return `<div class="country-groups">${["Y", "P", "C", "N"].filter((s) => groups[s].length).map((s) => {
    const items = groups[s].sort((a, b) => nm(a.c).localeCompare(nm(b.c)));

    CHAT.doc ? "\nATTACHED PROJECT DOCUMENT \"" + CHAT.doc.name + "\"" + (CHAT.doc.truncated ? " (first " + DOC_MAX + " characters)" : "") + ":\n<<<\n" + CHAT.doc.text + "\n>>>" : "",
  ].join("\n");
}
function callDetails(id, country) {
  const c = CALLS.find((x) => x.id === String(id).trim());
  if (!c) throw new Error("No call with ID " + id + " in the data. Use an ID from the OPEN CALLS list.");
  const n = nextDl(c);
  const out = {
    id: c.id, title: c.title, programme: c.programmeName, call: c.callId + " " + (c.callTitle || ""), status: n ? "open" : "closed",
    deadlines: c.deadlines.map((d) => ({ date: d.slice(0, 10), time: dlPlain(d).slice(11), hoursLeft: hoursLeft(d), passed: msLeft(d) <= 0 })),
    typesOfAction: c.typesOfAction, funding: c.funding, partnership: c.partnership, partnershipNote: c.partnershipNote,
    callSpecificNotes: c.notes, officialUrl: c.url,
    conditions: (c.conditions || "").slice(0, 7000) + (c.conditionsTruncated ? " [excerpt: full text on official page]" : ""),
    description: (c.description || "").slice(0, 7000) + (c.descriptionTruncated ? " [excerpt: full text on official page]" : ""),
  };
  const cc = country ? String(country).toUpperCase().trim() : F.country;
  if (cc && c.eligibility[cc]) { const e = elig(c, cc); out.eligibility = { country: cc, status: e.s, reason: e.note }; }
  const groups = { Y: [], P: [], C: [], N: [] }; Object.entries(c.eligibility).forEach(([k, [s]]) => groups[s].push(k)); out.eligibilityByStatus = groups;
  return out;
}
function searchCalls(q) {
  const words = norm(q).split(/\s+/).filter((w) => w.length > 2);
  if (!words.length) throw new Error("Give at least one search word longer than two letters.");
  return CALLS.filter(isOpen).map((c) => { const h = norm([c.title, c.callTitle, c.description, c.conditions, (c.keywords || []).join(" "), (c.tags || []).join(" ")].join(" ")); return { c, s: words.reduce((a, w) => a + (h.split(w).length - 1), 0) }; })
    .filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 15).map((x) => ({ id: x.c.id, title: x.c.title, hits: x.s, nextDeadline: dlPlain(nextDl(x.c)) }));
}

/* safe rendering: escape, then a small markdown subset; call IDs become links */
let ID_RE = null;
function renderMd(src) {
  if (!ID_RE) ID_RE = new RegExp("\\b(" + CALLS.map((c) => c.id.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).sort((a, b) => b.length - a.length).join("|") + ")\\b", "g");
  const inline = (s) => esc(s)
    .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
    .replace(/\[([^\]]+)\]\((https:\/\/ec\.europa\.eu\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(ID_RE, (m) => { const c = CALLS.find((x) => x.id === m); return c ? `<a href="#c-${c.key}" class="cid">${m}</a>` : m; });
  const lines = src.split("\n"); let html = "", list = null;
  const close = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^#{1,4}\s+(.*)/))) { close(); html += `<h4>${inline(m[1])}</h4>`; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += "<ol>"; list = "ol"; } html += `<li>${inline(m[1])}</li>`; continue; }
    close(); html += `<p>${inline(l)}</p>`;
  }
  close(); return html;
}

function chatEls() { return { panel: document.getElementById("chatPanel"), log: document.getElementById("chatLog"), box: document.getElementById("chatBox"), send: document.getElementById("chatSend"), file: document.getElementById("chatFile"), doc: document.getElementById("chatDoc"), note: document.getElementById("chatNote"), ctx: document.getElementById("chatCtx") }; }
function chatStatic() {
  const e = chatEls(); if (!e.panel) return;
  document.querySelectorAll("[data-ci18n]").forEach((el) => (el.textContent = ct(el.dataset.ci18n)));
  e.box.placeholder = ct("ph");
  document.getElementById("chatAttachBtn").setAttribute("aria-label", ct("attach")); document.getElementById("chatAttachBtn").title = ct("attach");
  e.ctx.textContent = ct("context") + ": " + (profileText() || ct("none"));
  if (!CHAT.turns.length) renderStarters();
  renderDocChip();
  const pv = document.getElementById("chatPrivacy"); if (pv) pv.textContent = CHAT.mode === "api" ? ct("privacy") : "";
}
function renderStarters() {
  const e = chatEls();
  e.log.innerHTML = `<div class="chat-empty"><p>${esc(ct("sub"))}</p><div class="starters">${ct("starters").map((s, i) => `<button type="button" class="starter" data-st="${i}">${esc(s)}</button>`).join("")}</div></div>`;
  e.log.querySelectorAll("[data-st]").forEach((b) => b.addEventListener("click", () => { e.box.value = ct("starters")[+b.dataset.st]; e.box.focus(); autosize(); }));
}
function renderDocChip() {
  const e = chatEls();
  e.doc.hidden = !CHAT.doc;
  if (CHAT.doc) e.doc.innerHTML = `<span>📄 ${esc(CHAT.doc.name)} · ${CHAT.doc.words.toLocaleString()} words${CHAT.doc.truncated ? " · " + esc(ct("docTooLong", DOC_MAX)) : ""}</span><button type="button" class="linkbtn" id="chatDocRm">${esc(ct("remove"))}</button>`;
  const rm = document.getElementById("chatDocRm"); if (rm) rm.addEventListener("click", () => { CHAT.doc = null; renderDocChip(); });
}
function autosize() { const b = chatEls().box; b.style.height = "auto"; b.style.height = Math.min(b.scrollHeight, 220) + "px"; }
function addMsg(role, html) { const e = chatEls(); if (!CHAT.turns.length && e.log.querySelector(".chat-empty")) e.log.innerHTML = ""; const d = document.createElement("div"); d.className = "msg " + role; d.innerHTML = html; e.log.appendChild(d); e.log.scrollTop = e.log.scrollHeight; return d; }
function setBusy(b) { CHAT.busy = b; const e = chatEls(); e.send.textContent = b ? ct("stop") : ct("send"); e.send.classList.toggle("stop", b); e.box.disabled = false; }
function openChat() { const e = chatEls(); e.panel.hidden = false; document.body.classList.add("chat-open"); chatStatic(); setTimeout(() => e.box.focus(), 50); }
function closeChat() { chatEls().panel.hidden = true; document.body.classList.remove("chat-open"); }

async function readDoc(file) {
  const e = chatEls(); e.note.textContent = ct("extracting");
  try {
    let text = ""; const name = file.name; const ext = name.split(".").pop().toLowerCase();
    if (ext === "pdf" || file.type === "application/pdf") {
      await loadScript(PDFJS_WORKER); await loadScript(PDFJS);
      const pdf = await window.pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
      for (let p = 1; p <= pdf.numPages && text.length < DOC_MAX + 2000; p++) { const pg = await pdf.getPage(p); const tc = await pg.getTextContent(); text += tc.items.map((i) => i.str).join(" ") + "\n\n"; }
    } else if (ext === "docx") {
      await loadScript(MAMMOTH);
      text = (await window.mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() })).value;
    } else if (["txt", "md", "rtf", "csv"].includes(ext) || file.type.startsWith("text/")) {
      text = await file.text();
    } else throw new Error("type");
    text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) throw new Error("empty");
    CHAT.doc = { name, text: text.slice(0, DOC_MAX), truncated: text.length > DOC_MAX, words: text.split(/\s+/).length };
    e.note.textContent = "";
  } catch (err) { CHAT.doc = null; e.note.textContent = ct("docFail"); }
  renderDocChip();
}

const hhmm = (iso) => new Intl.DateTimeFormat(loc(), { hour: "2-digit", minute: "2-digit" }).format(new Date(iso));
function chatError(code, info) {
  const e = chatEls();
  e.note.classList.remove("info");
  if (code === "cancelled") return;
  if (code === "resting") { e.note.textContent = ct("resting", hhmm(info.resetAt)); e.note.classList.add("info"); }
  else if (code === "visitor_limit") { e.note.textContent = ct("visitorLimit", info.limit, hhmm(info.resetAt)); e.note.classList.add("info"); }
  else if (code === "verification") e.note.textContent = ct("verify");
  else if (code === "interrupted") e.note.textContent = ct("interrupted");
  else if (code === "rate_limited") e.note.textContent = ct("limited");
  else if (code === "refused") e.note.textContent = ct("refused");
  else if (code === "prompt_too_large" || code === "too_large") e.note.textContent = ct("docTooLong", DOC_MAX);
  else if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) { e.note.textContent = code === "not_granted" ? ct("declined") : ct("unavailable"); CHAT.sample = null; CHAT.mode = null; }
  else if (code === "disabled") { e.note.textContent = ct("unavailable"); CHAT.mode = null; }
  else e.note.textContent = ct("failed");
}

/* Turnstile (bot check) on the public site, when a site key is configured */
const TS = { ready: null, id: null, token: null };
function setupTurnstile() {
  if (TS.ready || !CFG.turnstileSiteKey) return;
  TS.ready = new Promise((res) => { window.__konkursiTs = res; });
  loadScript("https://challenges.cloudflare.com/turnstile/v0/api.js?onload=__konkursiTs&render=explicit").catch(() => {});
  TS.ready.then(() => { TS.id = window.turnstile.render("#chatTs", { sitekey: CFG.turnstileSiteKey, appearance: "interaction-only", size: "flexible", "refresh-expired": "auto", callback: (tok) => { TS.token = tok; } }); });
}
async function turnstileToken() {
  if (!TS.ready) return "";
  await Promise.race([TS.ready, new Promise((r) => setTimeout(r, 8000))]);
  for (let i = 0; i < 80 && !TS.token; i++) await new Promise((r) => setTimeout(r, 250));
  return TS.token || "";
}
function resetTurnstile() { if (TS.id != null && window.turnstile) { TS.token = null; try { window.turnstile.reset(TS.id); } catch (err) {} } }

async function sendApi(bubble) {
  const body = {
    messages: CHAT.turns, lang,
    profile: { country: F.country || null, sectors: F.sectors, applicants: F.applicants, text: profileText() },
    doc: CHAT.doc ? { name: CHAT.doc.name, text: CHAT.doc.text } : null,
    turnstile: await turnstileToken(),
  };
  const r = await fetch("api/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body), signal: CHAT.ctl.signal });
  resetTurnstile();
  if (!r.ok || !(r.headers.get("content-type") || "").includes("event-stream")) {
    const j = await r.json().catch(() => ({}));
    throw Object.assign(new Error(j.error || "failed"), { code: j.error || "failed", info: j });
  }
  const reader = r.body.getReader(); const dec = new TextDecoder();
  let buf = "", text = "", done = false;
  const e = chatEls();
  for (;;) {
    const { value, done: end } = await reader.read();
    if (end) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 2);
      if (!line.startsWith("data:")) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch (err) { continue; }
      if (ev.d) { text += ev.d; bubble.innerHTML = renderMd(text); e.log.scrollTop = e.log.scrollHeight; }
      else if (ev.done) done = true;
      else if (ev.error) throw Object.assign(new Error(ev.error), { code: ev.error, text });
    }
  }
  if (!done) throw Object.assign(new Error("interrupted"), { code: "interrupted", text });
  return { text, truncated: false };
}

async function sendSample(bubble, status) {
  const tools = CHAT.toolsOk ? [
    { name: "get_call_details", description: "Returns the official details of one open call: deadlines (with their time), funding, types of action, partnership, call-specific notes, the official conditions text, the description, the official URL, and eligibility for a country (status and reason) plus all countries grouped by status. Use before recommending a call.",
      inputSchema: { type: "object", properties: { id: { type: "string", description: "Exact call ID from the OPEN CALLS list" }, country: { type: "string", description: "Two-letter country code of the applicant, optional" } }, required: ["id"] },
      execute: (inp) => { status(ct("tool", String(inp.id))); return callDetails(inp.id, inp.country); } },
    { name: "search_calls", description: "Full-text search over the titles, descriptions and conditions of all open calls. Returns up to 15 call IDs with hit counts. Use when the catalog excerpts are not enough to find relevant calls.",
      inputSchema: { type: "object", properties: { query: { type: "string", description: "Keywords, e.g. 'film distribution festival'" } }, required: ["query"] },
      execute: (inp) => { status(ct("searching", String(inp.query))); return searchCalls(String(inp.query)); } },
  ] : undefined;
  const e = chatEls();
  const input = [{ role: "user", content: rulesTurn() }, ...CHAT.turns];
  const opts = { signal: CHAT.ctl.signal, onText: ({ text }) => { bubble.innerHTML = renderMd(text); e.log.scrollTop = e.log.scrollHeight; } };
  if (tools) opts.tools = tools; else opts.cache = false;
  return CHAT.sample(input, opts);
}

async function sendChat() {
  const e = chatEls();
  if (CHAT.busy) { CHAT.ctl?.abort(); return; }
  const text = e.box.value.trim();
  if (!text && !CHAT.doc) return;
  if (!CHAT.mode) { e.note.textContent = ct("unavailable"); return; }
  const userText = text || (lang === "sr" ? "Analiziraj priloženi projekat i predloži najbolje pozive i plan." : "Analyse the attached project and recommend the best calls and a plan.");
  addMsg("user", `<p>${esc(userText)}</p>${CHAT.doc ? `<p class="fine">📄 ${esc(CHAT.doc.name)}</p>` : ""}`);
  e.box.value = ""; autosize(); e.note.textContent = ""; e.note.classList.remove("info");
  CHAT.turns.push({ role: "user", content: userText });
  while (CHAT.turns.length > 10) CHAT.turns.splice(0, 2);
  const bubble = addMsg("assistant", `<p class="thinking">${esc(ct("thinking"))}</p>`);
  const status = (s) => { if (bubble.querySelector(".thinking")) bubble.querySelector(".thinking").textContent = s; };
  CHAT.ctl = new AbortController(); setBusy(true);
  try {
    const res = CHAT.mode === "api" ? await sendApi(bubble) : await sendSample(bubble, status);
    bubble.innerHTML = renderMd(res.text) + (res.truncated ? `<p class="fine">${esc(ct("cut"))}</p>` : "");
    CHAT.turns.push({ role: "assistant", content: res.text });
  } catch (err) {
    const code = err && err.name === "AbortError" ? "cancelled" : (err && err.code) || "failed";
    if (err && err.text) bubble.innerHTML = renderMd(err.text); else bubble.remove();
    CHAT.turns.pop();
    chatError(code, (err && err.info) || {});
  } finally { setBusy(false); e.log.scrollTop = e.log.scrollHeight; }
}

async function apiHealth() {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 4000);
  try {
    const r = await fetch("api/health", { cache: "no-store", signal: ctl.signal });
    if (!r.ok || !(r.headers.get("content-type") || "").includes("json")) return null;
    const j = await r.json(); return j && j.ok ? j : null;
  } catch (err) { return null; } finally { clearTimeout(tm); }
}

async function initChat() {
  const e = chatEls(); if (!e.panel) return;
  document.addEventListener("click", (ev) => { if (ev.target.closest && ev.target.closest("[data-chat-open]")) openChat(); });
  document.getElementById("chatClose").addEventListener("click", closeChat);
  document.getElementById("chatClear").addEventListener("click", () => { CHAT.ctl?.abort(); CHAT.turns = []; CHAT.doc = null; chatStatic(); });
  e.send.addEventListener("click", sendChat);
  e.box.addEventListener("input", autosize);
  e.box.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); sendChat(); } });
  document.getElementById("chatAttachBtn").addEventListener("click", () => e.file.click());
  e.file.addEventListener("change", () => { if (e.file.files[0]) readDoc(e.file.files[0]); e.file.value = ""; });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !e.panel.hidden) closeChat(); });
  chatStatic();
  const h = await apiHealth();
  if (h) {
    CHAT.health = h; DOC_MAX = 8000;
    if (h.chat || h.resting) { CHAT.mode = "api"; if (h.turnstile) setupTurnstile(); }
    if (h.resting) chatError("resting", h);
    else if (!h.chat) e.note.textContent = ct("unavailable");
    chatStatic();
    return;
  }
  try { CHAT.sample = window.claude && window.claude.use ? await window.claude.use("sample") : null; } catch (err) { CHAT.sample = null; }
  if (CHAT.sample) { CHAT.mode = "sample"; DOC_MAX = 40000; try { const lim = await CHAT.sample.limits(); CHAT.toolsOk = !!lim.tools; } catch (err) { CHAT.toolsOk = false; } }
  else e.note.textContent = ct("unavailable");
}

/* ---------- live clock: countdowns tick, closed calls drop out at 17:00 Brussels ---------- */
let openSig = "";
const sigNow = () => CALLS ? CALLS.filter(isOpen).map((c) => c.key + "@" + nextDl(c)).join("|") : "";
/* Data age in the hero: "Updated 2 hours ago". Over 12 hours (imports run every 4) it turns terracotta. */
function updateAge() {
  if (!META) return;
  const min = Math.max(0, Math.floor((Date.now() - Date.parse(META.generated)) / 6e4));
  const txt = min < 2 ? t("updatedNow") : min < 60 ? t("updatedAgo", min, "m") : min < 48 * 60 ? t("updatedAgo", Math.floor(min / 60), "h") : t("updatedAgo", Math.floor(min / 1440), "d");
  const stale = min >= 12 * 60;
  document.querySelectorAll("[data-age]").forEach((el) => { el.textContent = "· " + txt + (stale ? " · " + t("staleNote") : ""); el.classList.toggle("stale", stale); });
}
function tick() {
  if (!CALLS) return;
  updateAge();
  document.querySelectorAll("[data-dl]").forEach((el) => { const v = leftText(el.dataset.dl); if (el.textContent !== v) el.textContent = v; });
  const sig = sigNow();
  if (openSig && sig !== openSig) {
    const y = window.scrollY;
    const typing = document.activeElement && document.getElementById("app").contains(document.activeElement) && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
    if (lastRoute === "home" && typing) { renderResults(); renderFilters(); document.querySelectorAll(".soon-item [data-dl]").forEach((el) => { if (msLeft(el.dataset.dl) <= 0) el.closest(".soon-item").remove(); }); }
    else if (lastRoute === "home") renderHome(); else route();
    applyLang(); updateSavedCount(); window.scrollTo(0, y);
  }
  openSig = sig;
}
setInterval(tick, 20000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });

/* ---------- router ---------- */
let lastRoute = "home", homeScroll = 0;
function route() {
  const h = decodeURIComponent(location.hash.slice(1)); let r = "home";
  if (h.startsWith("c-")) { r = "detail"; renderDetail(h.slice(2)); }
  else if (h.startsWith("p-")) { r = "programmes"; renderProgramme(h.slice(2)); }
  else if (h === "programmes") { r = "programmes"; renderProgrammes(); }
  else if (h === "deadlines") { r = "deadlines"; renderDeadlines(); }
  else if (h === "saved") { r = "saved"; renderSaved(); }
  else if (h === "updates") { r = "updates"; renderUpdates(); }
  else if (h === "about") { r = "about"; renderAbout(); }
  else renderHome();
  document.querySelectorAll("nav.main a").forEach((a) => { if (a.dataset.route === r) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  if (r === "home" && lastRoute === "detail" && homeScroll) window.scrollTo(0, homeScroll); else if (r !== "home" || lastRoute !== "home") window.scrollTo(0, 0);
  lastRoute = r;
}
window.addEventListener("scroll", () => { if (lastRoute === "home") homeScroll = window.scrollY; }, { passive: true });
function applyLang() {
  document.documentElement.lang = lang === "sr" ? "sr-Latn" : "en";
  document.querySelectorAll("[data-i18n]").forEach((el) => (el.textContent = t(el.dataset.i18n)));
  document.getElementById("footText").textContent = t("foot");
  if (META) {
    const ageH = Math.floor((Date.now() - Date.parse(META.generated)) / 36e5);
    document.getElementById("footData").textContent = t("footData", new Intl.DateTimeFormat(loc(), { day: "numeric", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Brussels", timeZoneName: "short" }).format(new Date(META.generated)));
    updateAge();
  }
  document.querySelectorAll("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  chatStatic();
}
document.querySelectorAll("[data-lang]").forEach((b) => b.addEventListener("click", () => { lang = b.dataset.lang; store.set("lang", lang); applyLang(); route(); }));
document.querySelectorAll('[data-nav="home"], nav.main a[data-route="home"]').forEach((a) => a.addEventListener("click", (e) => { if (location.hash === "" || location.hash === "#") { e.preventDefault(); route(); } }));
/* Light / dark: follows the system until the visitor picks one; the choice is kept on this device. */
const darkNow = () => document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : !!(window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
function syncThemeBtn() { const b = document.getElementById("themeBtn"); if (b) { const d = darkNow(); b.setAttribute("aria-label", d ? (lang === "sr" ? "Svetla tema" : "Switch to light theme") : (lang === "sr" ? "Tamna tema" : "Switch to dark theme")); b.title = b.getAttribute("aria-label"); } }
document.getElementById("themeBtn").addEventListener("click", () => { const next = darkNow() ? "light" : "dark"; document.documentElement.dataset.theme = next; store.set("theme", next); syncThemeBtn(); Wave.refresh(); });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", syncThemeBtn);
lang = store.get("lang", "en") === "sr" ? "sr" : "en";
syncThemeBtn();
load().then(() => { applyLang(); updateSavedCount(); window.addEventListener("hashchange", route); route(); openSig = sigNow(); initChat(); })
  .catch((err) => { document.getElementById("app").innerHTML = `<div class="wrap page"><h1>Could not load the data files</h1><p>${esc(err.message)}</p></div>`; });
})();
